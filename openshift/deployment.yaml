apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-summary-worker
  labels:
    app: ocr-summary-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ocr-summary-worker
  template:
    metadata:
      labels:
        app: ocr-summary-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ocr-summary-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 1001
          envFrom:
            - configMapRef:
                name: ocr-worker-config
            - secretRef:
                name: ocr-worker-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 10
